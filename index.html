<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santhosh Sivan — DevOps & Platform Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090b0e;--bg2:#10131a;--bg3:#181c26;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--text:#e2e6f0;--muted:#7a84a0;--accent:#00d4a0;--accent2:#3b82f6;--accent3:#f97316;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,160,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,160,0.025) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 5rem;background:rgba(9,11,14,0.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--mono);font-size:.82rem;color:var(--accent);letter-spacing:.06em}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-decoration:none;letter-spacing:.1em;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:var(--accent)}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9rem 5rem 5rem;position:relative;z-index:1;max-width:1280px;margin:0 auto}
.hero-tag{font-family:var(--mono);font-size:.72rem;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;margin-bottom:1.5rem;display:flex;align-items:center;gap:.75rem}
.hero-tag::before{content:'';display:inline-block;width:28px;height:1px;background:var(--accent)}
.hero h1{font-family:var(--mono);font-size:clamp(2.8rem,5.5vw,5rem);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin-bottom:1.5rem}
.hero h1 span{display:block;color:var(--accent)}
.hero-desc{max-width:620px;font-size:1.05rem;color:var(--muted);line-height:1.85;margin-bottom:3rem}
.hero-desc strong{color:var(--text);font-weight:500}
.hero-stats{display:flex;gap:0;margin-bottom:3rem;border:1px solid var(--border);border-radius:4px;overflow:hidden;width:fit-content}
.stat-item{display:flex;flex-direction:column;padding:1.25rem 2rem;border-right:1px solid var(--border)}
.stat-item:last-child{border-right:none}
.stat-num{font-family:var(--mono);font-size:1.9rem;font-weight:700;color:var(--accent);line-height:1}
.stat-label{font-size:.75rem;color:var(--muted);letter-spacing:.04em;margin-top:.3rem}
.hero-actions{display:flex;gap:.9rem;flex-wrap:wrap}
